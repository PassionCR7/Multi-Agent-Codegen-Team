<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多智能体代码生成团队</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --panel: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #bc8cff;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  header {
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: var(--bg-soft); position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted); background: #0d1117;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 28px 80px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 {
    margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .num {
    background: var(--accent); color: #0d1117; width: 20px; height: 20px;
    border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=text], textarea {
    width: 100%; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit; font-size: 13px; resize: vertical;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #0d1117; border: none;
    padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.danger { background: var(--yellow); }
  button.approve { background: var(--green); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 220px; }
  .muted { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }

  /* 状态胶囊 */
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-planning { color: var(--accent); }
  .s-awaiting_review { color: var(--yellow); background: rgba(210,153,34,.1); }
  .s-executing { color: var(--purple); }
  .s-done { color: var(--green); background: rgba(63,185,80,.1); }
  .s-error, .s-aborted, .s-plan_aborted { color: var(--red); background: rgba(248,81,73,.1); }

  /* 计划面板 */
  .plan-block { margin-bottom: 14px; }
  .plan-block > .title {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 6px;
  }
  .assume { color: var(--yellow); }
  .q-item {
    background: rgba(210,153,34,.08); border-left: 3px solid var(--yellow);
    padding: 7px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px;
  }
  .step {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 14px; margin-bottom: 8px; background: #0d1117;
  }
  .step .sid {
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: rgba(88,166,255,.12); padding: 1px 7px; border-radius: 4px; margin-right: 8px;
  }
  .step .files { font-size: 12px; color: var(--green); margin-top: 5px; }
  .step .verify { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .chip {
    display: inline-block; background: #0d1117; border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 6px; font-size: 12px; margin: 0 5px 5px 0;
    font-family: ui-monospace, Consolas, monospace;
  }
  .chip.scope { border-color: rgba(63,185,80,.4); color: var(--green); }
  .risk-hi { color: var(--red); } .risk-me { color: var(--yellow); } .risk-lo { color: var(--muted); }

  /* 时间线 */
  .tl-item {
    display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid #21262d;
    font-size: 13px; align-items: center;
  }
  .tl-item:last-child { border-bottom: none; }
  .tl-node { min-width: 150px; font-weight: 600; }
  .tl-meta { color: var(--muted); font-size: 12px; }
  .ok { color: var(--green); } .no { color: var(--muted); }

  /* 日志 */
  #log {
    background: #010409; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; max-height: 240px; overflow: auto; color: var(--muted);
    white-space: pre-wrap;
  }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details { margin-top: 10px; }
  pre.code {
    background: #010409; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow: auto; font-size: 12px; max-height: 380px;
    font-family: ui-monospace, Consolas, monospace; color: #c9d1d9;
  }
  .err { color: var(--red); }
  .spinner {
    width: 13px; height: 13px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>LangGraph 多智能体代码生成团队</h1>
  <span class="badge" id="cfgBadge">加载中…</span>
  <span class="badge">规划 → 确认 → 编码 / 对齐 / 安全 / 修复</span>
</header>

<main>
  <!-- 步骤 1：输入需求 -->
  <div class="card" id="inputCard">
    <h2><span class="num">1</span>描述你的编码需求</h2>
    <label>需求描述</label>
    <textarea id="requirement" rows="3"
      placeholder="例如：实现一个读取CSV文件并计算每列统计量（均值/中位数/标准差）的工具，要求能处理缺失值"></textarea>
    <div style="height:12px"></div>
    <label>项目根目录（agent 会扫描它以避免偏离真实项目）</label>
    <div class="row">
      <input type="text" id="projectRoot" class="grow" />
      <button id="startBtn">生成行动计划</button>
    </div>
    <div class="muted" style="margin-top:8px">
      生成计划后由你确认；不满意可打回重规划，也可以自己写方案。
    </div>
  </div>

  <!-- 状态条 -->
  <div class="card hidden" id="statusCard">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="status" id="statusPill"><span class="dot"></span><span id="statusText">…</span></span>
        <span class="muted" id="wsPath"></span>
      </div>
      <span class="muted" id="taskId"></span>
    </div>
  </div>

  <!-- 步骤 2：计划审核 -->
  <div class="card hidden" id="planCard">
    <h2><span class="num">2</span>审核行动计划<span class="muted" id="planRev"></span></h2>
    <div id="planBody"></div>

    <div id="reviewActions" class="hidden" style="margin-top:18px; border-top:1px solid var(--border); padding-top:16px">
      <div class="muted" style="margin-bottom:10px">请确认这份计划：</div>
      <div class="row">
        <button class="approve" id="approveBtn">✓ 批准，开始写代码</button>
        <button class="danger" id="rejectBtn">↺ 打回，重新规划</button>
        <button class="ghost" id="userPlanBtn">✎ 我自己写方案</button>
      </div>

      <div id="rejectBox" class="hidden" style="margin-top:14px">
        <label>不满意的原因（会作为重新规划的依据）</label>
        <textarea id="rejectNote" rows="2" placeholder="例如：改动范围太大，请只改一个文件；不要引入第三方依赖"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="danger" id="rejectSubmit">提交并重新规划</button>
          <button class="ghost" id="rejectCancel">取消</button>
        </div>
      </div>

      <div id="userPlanBox" class="hidden" style="margin-top:14px">
        <label>你期望的方案（每行一个步骤）</label>
        <textarea id="userPlanText" rows="4"
          placeholder="1. 新建 src/validator.py 实现核心函数&#10;2. 新建 tests/test_validator.py 补充测试"></textarea>
        <div style="height:10px"></div>
        <label>补充说明（可选）</label>
        <input type="text" id="userPlanNote" placeholder="例如：优先保证可读性" />
        <div style="height:10px"></div>
        <label>限定改动文件（可选，逗号分隔）</label>
        <input type="text" id="userPlanScope" placeholder="src/validator.py, tests/test_validator.py" />
        <div class="row" style="margin-top:10px">
          <button id="userPlanSubmit">提交我的方案</button>
          <button class="ghost" id="userPlanCancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 步骤 3：执行 -->
  <div class="card hidden" id="execCard">
    <h2><span class="num">3</span>执行过程</h2>
    <div id="timeline"></div>
    <div id="finalBox" class="hidden" style="margin-top:14px"></div>
  </div>

  <!-- 产物 -->
  <div class="card hidden" id="artifactCard">
    <h2>产出文件 <span class="muted" id="artifactCount"></span></h2>
    <div id="artifacts"></div>
  </div>

  <!-- 校验报告 -->
  <div class="card hidden" id="reportCard">
    <h2>校验报告</h2>
    <div id="reports"></div>
  </div>

  <!-- 日志 -->
  <div class="card hidden" id="logCard">
    <h2>运行日志</h2>
    <div id="log"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let taskId = null, timer = null, lastStatus = null, renderedPlanRev = null, renderedArtifacts = 0;

// ---------- 初始化：从后端拿到默认项目根目录与模型信息 ----------
let DEFAULT_PROJECT = '';
(async () => {
  try {
    const r = await fetch('/api/config');
    const c = await r.json();
    DEFAULT_PROJECT = c.project_root || '';
    $('projectRoot').value = DEFAULT_PROJECT;
    const mode = c.use_mock ? '离线 MockLLM' : `${c.model} @ ${c.base_url}`;
    $('cfgBadge').textContent = `模型: ${mode}`;
  } catch (e) {
    $('cfgBadge').textContent = '配置读取失败';
  }

  // 支持 ?task=<id> 直接打开某个任务（方便分享与刷新保持）
  const qs = new URLSearchParams(location.search);
  const preset = qs.get('task');
  if (preset) {
    taskId = preset;
    $('taskId').textContent = '任务 ' + taskId;
    show('statusCard'); show('logCard'); show('planCard');
    $('inputCard').classList.add('hidden');
    startPolling();
  }
})();

// ---------- 创建任务 ----------
$('startBtn').onclick = async () => {
  const requirement = $('requirement').value.trim();
  if (!requirement) { alert('请先填写需求描述'); return; }
  $('startBtn').disabled = true;
  $('startBtn').innerHTML = '<span class="spinner"></span> 规划中…';
  try {
    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requirement,
        project_root: $('projectRoot').value.trim() || DEFAULT_PROJECT || undefined,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '创建失败');
    taskId = data.task_id;
    $('taskId').textContent = '任务 ' + taskId;
    show('statusCard'); show('logCard'); show('planCard');
    $('inputCard').classList.add('hidden');
    startPolling();
  } catch (e) {
    alert('创建任务失败: ' + e.message);
    $('startBtn').disabled = false;
    $('startBtn').textContent = '生成行动计划';
  }
};

function startPolling() {
  if (timer) clearInterval(timer);
  timer = setInterval(poll, 1200);
  poll();
}

async function poll() {
  if (!taskId) return;
  try {
    const res = await fetch('/api/tasks/' + taskId);
    if (!res.ok) return;
    const s = await res.json();
    render(s);
  } catch (e) { /* 网络抖动忽略 */ }
}

// ---------- 渲染 ----------
function show(id) { $(id).classList.remove('hidden'); }

const STATUS_LABEL = {
  planning: '规划中',
  awaiting_review: '等待你审核',
  executing: '执行中',
  done: '已完成',
  aborted: '未完全达成',
  plan_aborted: '计划未获批准',
  error: '出错',
};

function render(s) {
  // 状态胶囊
  const pill = $('statusPill');
  pill.className = 'status s-' + s.status;
  $('statusText').textContent = STATUS_LABEL[s.status] || s.status;
  if (s.workspace) $('wsPath').textContent = s.workspace;
  if (s.snapshot_totals && s.snapshot_totals.files_scanned && lastStatus !== s.status) {
    /* 首次扫描信息可在日志里看 */
  }
  lastStatus = s.status;

  // 计划
  if (s.plan && Object.keys(s.plan).length) {
    show('planCard');
    const rev = (s.plan.revision ?? s.review_round ?? 1);
    if (renderedPlanRev !== rev || (s.status === 'awaiting_review')) {
      $('planRev').textContent = '（第 ' + rev + ' 版）';
      $('planBody').innerHTML = renderPlan(s.plan);
      renderedPlanRev = rev;
    }
  }

  // 审核按钮仅在等待审核时可用
  const awaiting = s.status === 'awaiting_review';
  $('reviewActions').classList.toggle('hidden', !awaiting);
  ['approveBtn','rejectBtn','userPlanBtn'].forEach(b => $(b).disabled = !awaiting);

  // 执行时间线
  if (s.timeline && s.timeline.length) {
    show('execCard');
    $('timeline').innerHTML = s.timeline.map(t => {
      const aligned = t.aligned ? '<span class="ok">对齐✓</span>' : '<span class="no">对齐—</span>';
      const safe = t.safe === true ? '<span class="ok">安全✓</span>' : (t.safe === false ? '<span class="err">安全问题</span>' : '<span class="no">安全—</span>');
      return `<div class="tl-item">
        <span class="tl-node">${esc(t.label)}</span>
        <span class="tl-meta">轮次 ${t.iteration} · 产物 ${t.artifacts} · ${aligned} · ${safe} · bugs ${t.bugs}</span>
      </div>`;
    }).join('');
  }

  // 最终结果
  if (s.terminal) {
    show('finalBox');
    const cls = s.success ? 'ok' : 'err';
    $('finalBox').innerHTML =
      `<div class="card" style="margin:0;border-color:${s.success ? 'rgba(63,185,80,.4)' : 'rgba(248,81,73,.4)'}">
        <div class="${cls}" style="font-weight:600;margin-bottom:8px">${s.success ? '✅ 任务成功完成' : '⚠️ 任务未完全达成'}</div>
        <pre class="code" style="max-height:none">${esc(s.final_summary || s.abort_reason || s.error || '')}</pre>
      </div>`;
  }

  // 产物
  if (s.artifacts && s.artifacts.length) {
    show('artifactCard');
    $('artifactCount').textContent = `（${s.artifacts.length} 个）`;
    if (s.artifacts.length !== renderedArtifacts) {
      renderedArtifacts = s.artifacts.length;
      $('artifacts').innerHTML = s.artifacts.map(a => `
        <details>
          <summary>${esc(a.path)} <span class="muted">${esc(a.language||'')} · 第${a.revision}版</span></summary>
          ${a.description ? `<div class="muted" style="margin:6px 0">${esc(a.description)}</div>` : ''}
          <pre class="code">${esc(a.content || '(无内容)')}</pre>
        </details>`).join('');
    }
  }

  // 校验报告
  const hasReport = (s.alignment && Object.keys(s.alignment).length) || (s.security && Object.keys(s.security).length);
  if (hasReport) {
    show('reportCard');
    $('reports').innerHTML = renderReports(s);
  }

  // 日志
  if (s.log && s.log.length) {
    const el = $('log');
    el.textContent = s.log.join('\n');
    el.scrollTop = el.scrollHeight;
  }
}

function renderPlan(p) {
  let h = '';
  if (p.understanding) {
    h += `<div class="plan-block"><div class="title">需求理解</div><div>${esc(p.understanding)}</div></div>`;
  }
  if (p.assumptions && p.assumptions.length) {
    h += `<div class="plan-block"><div class="title">关键假设 · 若有误请打回</div>` +
      p.assumptions.map(a => `<div class="assume">⚠ ${esc(a)}</div>`).join('') + `</div>`;
  }
  if (p.open_questions && p.open_questions.length) {
    h += `<div class="plan-block"><div class="title">待你确认的问题</div>` +
      p.open_questions.map((q,i) => `<div class="q-item">${i+1}. ${esc(q)}</div>`).join('') + `</div>`;
  }
  if (p.steps && p.steps.length) {
    h += `<div class="plan-block"><div class="title">Plan-Act 执行步骤</div>` +
      p.steps.map(s => `<div class="step">
        <span class="sid">${esc(s.id||'')}</span><strong>${esc(s.goal||'')}</strong>
        ${s.detail ? `<div class="muted" style="margin-top:4px">${esc(s.detail)}</div>` : ''}
        ${(s.files && s.files.length) ? `<div class="files">涉及: ${s.files.map(f=>esc(f)).join(', ')}</div>` : ''}
        ${s.verify ? `<div class="verify">验证: ${esc(s.verify)}</div>` : ''}
      </div>`).join('') + `</div>`;
  }
  const scopes = (p.scope && p.scope.files) || [];
  if (scopes.length) {
    h += `<div class="plan-block"><div class="title">改动范围 · 强约束（coder 只能动这些文件）</div>` +
      scopes.map(f => `<span class="chip scope">${esc(f)}</span>`).join('') + `</div>`;
  }
  if (p.out_of_scope && p.out_of_scope.length) {
    h += `<div class="plan-block"><div class="title">明确不做</div>` +
      p.out_of_scope.map(o => `<div class="muted">· ${esc(o)}</div>`).join('') + `</div>`;
  }
  if (p.risks && p.risks.length) {
    h += `<div class="plan-block"><div class="title">风险</div>` +
      p.risks.map(r => {
        const sev = (r.severity||'medium').toLowerCase();
        const cls = sev === 'high' ? 'risk-hi' : (sev === 'low' ? 'risk-lo' : 'risk-me');
        return `<div style="margin-bottom:5px"><span class="${cls}">[${sev.toUpperCase()}]</span> ${esc(r.description||'')}
          ${r.mitigation ? `<div class="muted" style="padding-left:8px">缓解: ${esc(r.mitigation)}</div>` : ''}</div>`;
      }).join('') + `</div>`;
  }
  if (p.test_plan) {
    h += `<div class="plan-block"><div class="title">验证方式</div><div class="muted">${esc(p.test_plan)}</div></div>`;
  }
  return h;
}

function renderReports(s) {
  let h = '';
  const a = s.alignment || {};
  if (Object.keys(a).length) {
    const ok = a.aligned;
    h += `<div class="plan-block"><div class="title">需求对齐 ${ok ? '<span class="ok">通过</span>' : '<span class="err">未通过</span>'} ${a.score !== undefined ? '· 评分 '+a.score : ''}</div>`;
    if (a.coverage && a.coverage.length) {
      h += a.coverage.map(c => `<div style="margin-bottom:3px"><span class="${c.implemented?'ok':'err'}">${c.implemented?'✓':'✗'}</span> ${esc(c.requirement)} <span class="muted">— ${esc(c.evidence||'')}</span></div>`).join('');
    }
    if (a.missing && a.missing.length) {
      h += a.missing.map(m => `<div class="q-item">缺失[${esc(m.severity||'')}] ${esc(m.requirement||'')}: ${esc(m.why||'')}</div>`).join('');
    }
    if (a.issues && a.issues.length) {
      h += a.issues.map(i => `<div class="muted">· [${esc(i.severity||'')}] ${esc(i.problem||'')} → ${esc(i.suggestion||'')}</div>`).join('');
    }
    h += `</div>`;
  }
  const sec = s.security || {};
  if (Object.keys(sec).length) {
    const ok = sec.safe;
    h += `<div class="plan-block"><div class="title">安全审计 ${ok ? '<span class="ok">通过</span>' : '<span class="err">发现问题</span>'}</div>`;
    const fs = sec.findings || [];
    if (!fs.length) h += `<div class="muted">未发现安全问题</div>`;
    else h += fs.map(f => `<div style="margin-bottom:5px"><span class="${f.severity==='high'||f.severity==='critical'?'err':'risk-me'}">[${esc(f.severity||'')}]</span> ${esc(f.description||'')}
      ${f.location ? `<span class="muted">@ ${esc(f.location)}</span>` : ''}
      ${f.recommendation ? `<div class="muted" style="padding-left:8px">建议: ${esc(f.recommendation)}</div>` : ''}</div>`).join('');
    if (sec.summary) h += `<div class="muted" style="margin-top:6px">${esc(sec.summary)}</div>`;
    h += `</div>`;
  }
  const b = s.bugfix || {};
  if (b.bugs && b.bugs.length) {
    h += `<div class="plan-block"><div class="title">缺陷修复</div>` +
      b.bugs.map(x => `<div class="muted">· [${esc(x.severity||'')}] ${esc(x.problem||'')}（来源 ${esc(x.source||'')}）</div>`).join('') + `</div>`;
  }
  return h;
}

function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---------- 审核动作 ----------
async function submitReview(payload, btn) {
  btn.disabled = true;
  try {
    const res = await fetch(`/api/tasks/${taskId}/review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '提交失败');
    $('rejectBox').classList.add('hidden');
    $('userPlanBox').classList.add('hidden');
    $('reviewActions').classList.add('hidden');
    renderedPlanRev = null;   // 下一版计划强制重渲染
    poll();
  } catch (e) {
    alert('提交失败: ' + e.message);
    btn.disabled = false;
  }
}

$('approveBtn').onclick = () => submitReview({ action: 'approve' }, $('approveBtn'));
$('rejectBtn').onclick = () => { $('userPlanBox').classList.add('hidden'); $('rejectBox').classList.toggle('hidden'); };
$('rejectCancel').onclick = () => $('rejectBox').classList.add('hidden');
$('rejectSubmit').onclick = () => {
  const note = $('rejectNote').value.trim();
  if (!note) { alert('请填写不满意的原因'); return; }
  submitReview({ action: 'reject', note }, $('rejectSubmit'));
};
$('userPlanBtn').onclick = () => { $('rejectBox').classList.add('hidden'); $('userPlanBox').classList.toggle('hidden'); };
$('userPlanCancel').onclick = () => $('userPlanBox').classList.add('hidden');
$('userPlanSubmit').onclick = () => {
  const text = $('userPlanText').value.trim();
  if (!text) { alert('请填写你的方案'); return; }
  submitReview({
    action: 'user_plan',
    user_plan_text: text,
    note: $('userPlanNote').value.trim(),
    scope_files: $('userPlanScope').value.trim(),
  }, $('userPlanSubmit'));
};
</script>
